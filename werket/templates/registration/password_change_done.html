{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password changed — Werket | ወርቀት</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="{% static 'icon.svg' %}">
  <link rel="stylesheet" href="{% static 'werket.css' %}">
  <style>
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; background: var(--bg); padding: 24px; }
    .auth-card { width: 100%; max-width: 400px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px; text-align: center; }
    .auth-card .brand { font-size: 28px; }
    .auth-card h1 { font-size: 22px; color: var(--ink); margin: 16px 0 8px; }
    .auth-card p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    .auth-card a.btn { display: inline-block; width: 100%; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">✅</div>
      <h1>Password changed</h1>
      <p class="sub">Your password has been updated successfully.</p>
      <a href="{% url 'index' %}" class="btn icon-btn primary">Back to Werket</a>
    </div>
  </div>
</body>
</html>
