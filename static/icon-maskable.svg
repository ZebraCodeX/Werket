<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1a2a5e"/>
  <g transform="translate(256 256) scale(.55) translate(-256 -256)">
    <defs>
      <linearGradient id="lionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#f5d06e;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#e8b84d;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#d4a03a;stop-opacity:1" />
      </linearGradient>
      <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#c4741e;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#a85d18;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
      </linearGradient>
    </defs>
    <!-- Mane back layer -->
    <path fill="url(#maneGrad)" d="M140 120 
      Q100 100 80 140 Q60 180 100 220 Q140 260 180 260 Q220 260 260 220 Q300 180 280 140 Q260 100 220 120 Q180 140 140 120 Z"/>
    <!-- Face -->
    <ellipse cx="256" cy="200" rx="110" ry="100" fill="url(#lionGrad)"/>
    <!-- Mane front layer -->
    <path fill="url(#maneGrad)" d="M160 140 
      Q120 120 100 160 Q80 200 120 240 Q160 280 200 280 Q240 280 280 240 Q320 200 300 160 Q280 120 240 140 Q200 160 160 140 Z"/>
    <!-- Ears -->
    <ellipse cx="150" cy="110" rx="25" ry="35" fill="url(#lionGrad)" transform="rotate(-20 150 110)"/>
    <ellipse cx="140" cy="105" rx="15" ry="20" fill="#e8b84d" transform="rotate(-20 150 110)"/>
    <ellipse cx="362" cy="110" rx="25" ry="35" fill="url(#lionGrad)" transform="rotate(20 362 110)"/>
    <ellipse cx="372" cy="105" rx="15" ry="20" fill="#e8b84d" transform="rotate(20 362 110)"/>
    <!-- Eyes -->
    <ellipse cx="200" cy="180" rx="18" ry="22" fill="#fff"/>
    <ellipse cx="200" cy="180" rx="8" ry="10" fill="#1a1a2e"/>
    <ellipse cx="205" cy="175" rx="4" ry="4" fill="#fff"/>
    <ellipse cx="312" cy="180" rx="18" ry="22" fill="#fff"/>
    <ellipse cx="312" cy="180" rx="8" ry="10" fill="#1a1a2e"/>
    <ellipse cx="317" cy="175" rx="4" ry="4" fill="#fff"/>
    <!-- Eyebrows -->
    <path fill="none" stroke="#8b4513" stroke-width="4" stroke-linecap="round" d="M175 160 Q200 150 225 160"/>
    <path fill="none" stroke="#8b4513" stroke-width="4" stroke-linecap="round" d="M287 160 Q312 150 337 160"/>
    <!-- Nose -->
    <ellipse cx="256" cy="210" rx="20" ry="16" fill="#2d1810"/>
    <ellipse cx="246" cy="208" rx="6" ry="4" fill="#1a0f08"/>
    <ellipse cx="266" cy="208" rx="6" ry="4" fill="#1a0f08"/>
    <!-- Mouth open (roaring) -->
    <path fill="#1a0f08" d="M256 225 Q240 240 230 265 Q240 290 256 310 Q272 290 282 265 Q272 240 256 225 Z"/>
    <!-- Tongue -->
    <ellipse cx="256" cy="275" rx="15" ry="12" fill="#c0392b"/>
    <ellipse cx="256" cy="270" rx="10" ry="6" fill="#e74c3c"/>
    <!-- Teeth upper -->
    <path fill="#fff" d="M235 228 Q238 235 241 228 Q244 235 247 228 Q250 235 253 228 Q256 235 259 228 Q262 235 265 228 Q268 235 271 228 Q274 235 277 228"/>
    <!-- Teeth lower -->
    <path fill="#fff" d="M235 280 Q238 273 241 280 Q244 273 247 280 Q250 273 253 280 Q256 273 259 280 Q262 273 265 280 Q268 273 271 280 Q274 273 277 280"/>
    <!-- Whiskers -->
    <g stroke="#6b4423" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
      <path d="M225 220 Q200 215 175 210"/>
      <path d="M225 230 Q200 230 175 235"/>
      <path d="M225 240 Q200 245 175 250"/>
      <path d="M287 220 Q312 215 337 210"/>
      <path d="M287 230 Q312 230 337 235"/>
      <path d="M287 240 Q312 245 337 250"/>
    </g>
    <!-- Crown/halo suggestion (Lion of Judah) -->
    <path fill="none" stroke="#f5d06e" stroke-width="2" stroke-dasharray="8,4" d="M256 70 Q200 80 180 130 Q160 180 200 220 Q240 260 256 280"/>
    <circle cx="256" cy="70" r="6" fill="#f5d06e"/>
    <circle cx="200" cy="90" r="4" fill="#f5d06e"/>
    <circle cx="312" cy="90" r="4" fill="#f5d06e"/>
  </g>
</svg>